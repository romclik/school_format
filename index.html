<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Що було в школі 🎒</title>
<style>
:root{--bg1:#ffd6e8;--bg2:#cfe3ff;--card:#fffdf8;--ink:#2a2140;--mute:#7a7096;--acc:#7c4dff;--acc2:#ffe45c;--pink:#ff5fa2;--line:#e3d9ff;--field:#eef3ff}
@media (prefers-color-scheme:dark){:root{--bg1:#2b1745;--bg2:#10294d;--card:#241b3a;--ink:#f6f0ff;--mute:#aea3cc;--acc:#a98bff;--acc2:#ffd93d;--pink:#ff7ab6;--line:#40335f;--field:#1a1330}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--ink);font:17px/1.5 "Trebuchet MS","Comic Sans MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:22px 14px}
main{width:100%;max-width:560px;background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:24px;box-shadow:8px 8px 0 var(--ink);align-self:flex-start}
h1{font-size:2rem;line-height:1.15;margin:0 0 6px}
h2{font-size:1.3rem;margin:0 0 14px}
h3{font-size:1.05rem;margin:16px 0 8px}
p.sub{color:var(--mute);margin:0 0 18px}
.hero{font-size:3rem;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:2.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 16px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
button:hover{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:5px 5px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
button.big{flex:1;min-width:140px;font-size:1.2rem;font-weight:700;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
button.big span{font-size:2.6rem}
button.roma{background:#8be9c1;color:#12301f}
button.max{background:#ffb86b;color:#3b2106}
button.wa{background:#a5c8ff;color:#10294d}
button.wb{background:#ffa6d0;color:#4a0f2c}
button.on{background:var(--acc);color:#fff}
button.go{background:var(--acc2);color:#2a2140;font-weight:700}
button.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--mute)}
button.ghost:hover{box-shadow:none;transform:none;color:var(--ink)}
.date{display:inline-block;background:var(--pink);color:#fff;font-weight:700;border:2.5px solid var(--ink);border-radius:999px;padding:3px 14px;margin-bottom:12px;font-size:.95rem}
.bar{height:14px;background:var(--line);border:2.5px solid var(--ink);border-radius:12px;margin-bottom:18px;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--pink),var(--pink) 10px,var(--acc2) 10px,var(--acc2) 20px);transition:width .3s}
.rate button{padding:8px 0;width:calc(20% - 8px);text-align:center;line-height:1.2;font-size:1.3rem}
.rate small{display:block;font-size:.75rem;opacity:.8}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--field);border:2.5px solid var(--ink);border-radius:16px;padding:12px;margin-bottom:14px}
textarea{min-height:110px;resize:vertical}
pre{white-space:pre-wrap;word-break:break-word;background:var(--field);border:2.5px dashed var(--ink);border-radius:16px;padding:14px;font:inherit;margin:0 0 14px}
code{background:var(--field);border:1.5px solid var(--line);border-radius:6px;padding:0 5px}
.dbg{margin-top:22px;border-top:2.5px dashed var(--line);padding-top:12px}
.dbg button{padding:6px 12px;font-size:.9rem}
.les{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--field);border:2px solid var(--ink);border-radius:14px;padding:6px 10px;margin-bottom:8px}
.les span{display:flex;gap:6px;flex-shrink:0}
.les button{padding:2px 9px;box-shadow:2px 2px 0 var(--ink)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;max-height:300px;overflow:auto;margin-bottom:14px;padding:4px}
.pick button{padding:6px 8px;font-size:.9rem;text-align:left}
ol{padding-left:22px;margin:0 0 14px}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.hero{display:inline-block;animation:wob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.hero{animation:none}button{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const VERSION="1.3";
// [назва, "на ..." для питання, символ]
const S={
 ist:["Історія","історії","📜"],tech:["Технології","технологіях","🛠️"],bio:["Біологія","біології","🧬"],
 geom:["Геометрія","геометрії","📐"],eng:["Англійська мова","англійській мові","🇬🇧"],health:["Основи здоров'я","основах здоров'я","💗"],
 pe:["Фізкультура","фізкультурі","⚽"],alg:["Алгебра","алгебрі","🔢"],chem:["Хімія","хімії","🧪"],
 fexp:["Фізичні експерименти","фізичних експериментах","🔬"],ukr:["Українська мова","українській мові","🇺🇦"],art:["Мистецтво","мистецтві","🎨"],
 geo:["Географія","географії","🌍"],phys:["Фізика","фізиці","⚛️"],ulit:["Українська література","українській літературі","📖"],
 inf:["Інформатика","інформатиці","💻"],flit:["Зарубіжна література","зарубіжній літературі","📚"],eco:["Економіка","економіці","💰"],
 nfr:["Навчальна французька","навчальній французькій","🇫🇷"],math:["Математика","математиці","🔢"],fr:["Французька мова","французькій мові","🇫🇷"],
 hg:["Історія та географія","історії та географії","🗺️"],part:["Практичне мистецтво","практичному мистецтві","✂️"],
 es:["Іспанська мова","іспанській мові","🇪🇸"],mus:["Музика","музиці","🎵"],nat:["Природнича наука","природничій науці","🌱"],
 ahist:["Історія України","історії України","🇺🇦"],whist:["Всесвітня історія","всесвітній історії","🌐"],
 ast:["Астрономія","астрономії","🔭"],ger:["Німецька мова","німецькій мові","🇩🇪"],pol:["Польська мова","польській мові","🇵🇱"],
 ita:["Італійська мова","італійській мові","🇮🇹"],chi:["Китайська мова","китайській мові","🇨🇳"],jap:["Японська мова","японській мові","🇯🇵"],
 tur:["Турецька мова","турецькій мові","🇹🇷"],lat:["Латина","латині","🏛️"],fl:["Іноземна мова","іноземній мові","🗣️"],
 nger:["Навчальна німецька","навчальній німецькій","🇩🇪"],nen:["Навчальна англійська","навчальній англійській","🇬🇧"],
 nes:["Навчальна іспанська","навчальній іспанській","🇪🇸"],ukrl:["Українська мова й література","українській мові й літературі","🇺🇦"],
 lit:["Література","літературі","📕"],wlit:["Світова література","світовій літературі","🌎"],read:["Позакласне читання","позакласному читанні","📘"],
 stat:["Статистика та ймовірність","статистиці та ймовірності","📊"],calc:["Алгебра і початки аналізу","алгебрі і початках аналізу","➗"],
 stereo:["Стереометрія","стереометрії","🧊"],prog:["Програмування","програмуванні","👨‍💻"],robo:["Робототехніка","робототехніці","🤖"],
 des:["Дизайн","дизайні","🖌️"],draw:["Креслення","кресленні","📏"],vis:["Образотворче мистецтво","образотворчому мистецтві","🖼️"],
 thea:["Театральне мистецтво","театральному мистецтві","🎭"],dance:["Хореографія","хореографії","💃"],choir:["Хор","хорі","🎶"],
 law:["Правознавство","правознавстві","⚖️"],civ:["Громадянська освіта","громадянській освіті","🗳️"],psy:["Психологія","психології","🧠"],
 phil:["Філософія","філософії","🤔"],eth:["Етика","етиці","🤝"],logic:["Логіка","логіці","🧩"],rhet:["Риторика","риториці","🎤"],
 media:["Медіаграмотність","медіаграмотності","📰"],jour:["Журналістика","журналістиці","🗞️"],ecol:["Екологія","екології","♻️"],
 envi:["Природознавство","природознавстві","🌿"],bioeco:["Біологія й екологія","біології й екології","🌳"],geol:["Геологія","геології","🪨"],
 physast:["Фізика й астрономія","фізиці й астрономії","🚀"],labor:["Трудове навчання","трудовому навчанні","🔨"],
 cook:["Кулінарія","кулінарії","🍳"],chess:["Шахи","шахах","♟️"],swim:["Плавання","плаванні","🏊"],sport:["Спортивні ігри","спортивних іграх","🏀"],
 def:["Захист України","захисті України","🛡️"],mil:["Допризовна підготовка","допризовній підготовці","🎖️"],
 med:["Домедична підготовка","домедичній підготовці","🩺"],ent:["Підприємництво","підприємництві","💼"],
 fin:["Фінансова грамотність","фінансовій грамотності","💳"],stem:["STEM","STEM","🔧"],elect:["Курс за вибором","курсі за вибором","🎲"],
 fac:["Факультатив","факультативі","✨"],hour:["Класна година","класній годині","🏫"],integ:["Інтегрований курс","інтегрованому курсі","🧭"],
 relig:["Релігієзнавство","релігієзнавстві","🕌"],ukrz:["Українознавство","українознавстві","🌻"],kraj:["Краєзнавство","краєзнавстві","🏞️"],
 ling:["Мовознавство","мовознавстві","🔤"]
};
const LUNCH=["Обід","","🍽️"];
const WD=["Неділя","Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"]; // JS getDay()
const WDS=["Нд","Пн","Вт","Ср","Чт","Пт","Сб"];
const MON=["Січня","Лютого","Березня","Квітня","Травня","Червня","Липня","Серпня","Вересня","Жовтня","Листопада","Грудня"];
const NAMES={roma:"Рома",A:"Максим, тиждень A",B:"Максим, тиждень B"};
// Кожен розклад — один рядок: його можна замінити цілком (див. дебаг → Змінити розклад)
const SCHED={
 roma:[["ahist","whist","tech","bio","eng","geom","geom"],["health","pe","alg","alg","bio","chem","chem"],["fexp","ukr","art","geo","geo","phys","ulit"],["inf","inf","geom","geom","phys","eng","flit"],["eco","eng","alg","alg","pe","ukr","ukr"]],
 A:[["nfr","math","eng","eng","fr","nfr","hg"],["nfr","math","fr","hg","fr"],["fr","eng","hg","part"],["nfr","nfr","nfr","nfr","math"],["es","fr","mus","math","hg","nat","nat"]],
 B:[["nfr","math","eng","eng","fr","nfr","hg"],["fr","math","nfr","pe"],["fr","eng","nfr","part"],["nfr","nfr","nfr","fr","math"],["es","fr","mus","math","hg","nat"]],
};
const RATE=["💀","💀","😔","😔","😐","🙂","☺️","😄","🤩","🔥"];

const st={step:"who",who:null,week:null,list:[],i:0,ans:[],dbg:null,dbgOpen:false,ed:null};
const $=document.getElementById("app");
const e=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const okAns=a=>a.text.trim().length>0&&a.r!==0;

function datePill(){const l=dateLine();return l?`<span class="date">${l}</span>`:""}
function dayIdx(){return st.dbg!==null?st.dbg:new Date().getDay()}
function theDate(){
 const d=new Date(),real=d.getDay();
 if(st.dbg!==null)d.setDate(d.getDate()+((st.dbg+6)%7)-((real+6)%7));
 return d;
}
function dateLine(){if(st.dbg!==null)return "";const d=theDate();return `${WD[d.getDay()]} - ${d.getDate()} ${MON[d.getMonth()]}`}
function begin(){
 const idx=dayIdx();
 if(idx===0||idx===6){st.step="weekend";return}
 const sc=[]; // пари підряд = один урок, укр + всесвітня історія = "Історія"
 for(const k of SCHED[st.who==="roma"?"roma":st.week][idx-1]){
  const p=sc[sc.length-1];
  if(p===k)continue;
  if((p==="ahist"&&k==="whist")||(p==="whist"&&k==="ahist")){sc[sc.length-1]="ist";continue}
  sc.push(k);
 }
 st.list=sc.map(k=>S[k]).concat([LUNCH]);
 st.ans=st.list.map(()=>({text:"",r:0}));st.i=0;st.step="q";
}
function dbgHtml(){
 let h=`<div class="dbg"><button data-act="dbg">🐞 Дебаг режим</button>`;
 if(st.dbgOpen){
  h+=`<p class="sub" style="margin:10px 0 0">Версія застосунку: ${VERSION}</p>
  <h3>Перемикання днів</h3>
  <p class="sub" style="margin-bottom:8px">Зараз: ${st.dbg===null?"автоматично ("+WD[new Date().getDay()]+")":WD[st.dbg]}</p>
  <div class="row"><button class="${st.dbg===null?'on':''}" data-dbg="auto">Авто</button>
  ${[1,2,3,4,5,6,0].map(i=>`<button class="${st.dbg===i?'on':''}" data-dbg="${i}">${WDS[i]}</button>`).join("")}</div>
  <h3>Розклад</h3>
  <div class="row"><button data-act="edit">✏️ Змінити розклад</button></div>`;
 }
 return h+`</div>`;
}
function lessonLine(k,i){return `<div class="les"><span style="display:block"><b>${i+1}.</b> ${S[k][2]} ${e(S[k][0])}</span><span><button data-mv="${i}:-1" aria-label="Вище">↑</button><button data-mv="${i}:1" aria-label="Нижче">↓</button><button data-rm="${i}" aria-label="Видалити">✕</button></span></div>`}
function schedLine(key,lists){return ` ${key}:[${lists.map(l=>"["+l.map(k=>`"${k}"`).join(",")+"]").join(",")}],`}
function actBtn(a,last){return okAns(a)?`<button class="go" data-act="next">${last?"Готово 🎉":"Далі ➡️"}</button>`:`<button data-act="skip">Пропустити ⏭️</button>`}
function render(){
 let h="",dbg=false;
 if(st.step==="who"){
  dbg=true;
  h=`<div class="hero">🎒</div><h1>Що було в школі?</h1><p class="sub">Розкажи, як пройшов день! Хто ти?</p>
  <div class="row"><button class="big roma" data-who="roma"><span>😎</span>Рома</button><button class="big max" data-who="max"><span>🥐</span>Максим</button></div>`;
 }else if(st.step==="week"){
  h=`<div class="hero">📅</div><h2>Який зараз тиждень?</h2>
  <div class="row"><button class="big wa" data-week="A"><span>🅰️</span>Тиждень A</button><button class="big wb" data-week="B"><span>🅱️</span>Тиждень B</button></div>
  <button class="ghost" data-act="home">← Назад</button>`;
 }else if(st.step==="weekend"){
  h=`${datePill()}<div class="hero">🎉</div><h1>Сьогодні вихідний!</h1>
  <p class="sub">Уроків нема, відпочивай 😴 Щоб потестити інший день, відкрий дебаг режим у головному меню.</p>
  <button class="go" data-act="home">← На початок</button>`;
 }else if(st.step==="q"){
  const l=st.list[st.i],a=st.ans[st.i],last=st.i===st.list.length-1;
  h=`${datePill()}<div class="bar"><i style="width:${st.i/st.list.length*100}%"></i></div>
  <h2>${l[2]} ${l===LUNCH?"Що ти їв на обід?":`Що у тебе було на ${e(l[1])}?`}</h2>
  <textarea id="txt" placeholder="${l===LUNCH?'Що їли, смачно чи ні...':'Напиши, що було на уроці...'}">${e(a.text)}</textarea>
  <p class="sub" style="margin-bottom:8px">${l===LUNCH?"Оцінка обіду":"Оцінка уроку"}</p>
  <div class="row rate">${RATE.map((r,i)=>`<button class="${a.r===i+1?'on':''}" data-r="${i+1}">${r}<small>${i+1}</small></button>`).join("")}</div>
  <div class="row"><span id="act">${actBtn(a,last)}</span><button class="ghost" data-act="prev">← Назад</button></div>
  <p class="sub" id="hint" style="font-size:.85rem" ${okAns(a)?"hidden":""}>Щоб піти далі, напиши опис і постав оцінку.</p>`;
 }else if(st.step==="out"){
  h=`<div class="hero">✅</div><h2>Все готово!</h2>
  <pre id="out">${e(build())}</pre>
  <div class="row"><button class="go" id="copy">📋 Скопіювати</button>
  <button data-act="prev">← Назад</button><button data-act="home">Заново</button></div>`;
 }else if(st.step==="edWho"){
  h=`<div class="hero">✏️</div><h2>Чий розклад змінюємо?</h2>
  <div class="row"><button class="big roma" data-ed="roma"><span>😎</span>Рома</button><button class="big wa" data-ed="A"><span>🅰️</span>Максим, тиждень A</button><button class="big wb" data-ed="B"><span>🅱️</span>Максим, тиждень B</button></div>
  <button class="ghost" data-act="home">← Назад</button>`;
 }else if(st.step==="edDay"){
  const d=st.ed,L=d.lists[d.day];
  h=`<h2>${NAMES[d.key]}: ${WD[d.day+1]} (${d.day+1}/5)</h2>
  <p class="sub" style="font-size:.85rem;margin-bottom:10px">Додавай кожен урок окремо. Пари підряд (і укр з всесвітньою історією) об'єднаються самі, коли будеш описувати день.</p>
  <div>${L.map(lessonLine).join("")||'<p class="sub">Уроків ще нема. Додай перший!</p>'}</div>
  ${d.pick?`<input type="text" id="srch" placeholder="🔍 Пошук уроку..." autocomplete="off">
  <div class="pick">${Object.keys(S).sort((a,b)=>S[a][0].localeCompare(S[b][0],"uk")).map(k=>`<button class="pk" data-add="${k}">${S[k][2]} ${e(S[k][0])}</button>`).join("")}</div>
  <button class="ghost" data-act="unpick">Закрити список</button>`:`<div class="row"><button data-act="pick">➕ Додати урок</button><button class="ghost" data-act="clear">Очистити день</button></div>`}
  <div class="row"><button class="go" data-act="${d.day===4?"edFinish":"edNext"}">${d.day===4?"Завершити 🏁":"Наступний день ➡️"}</button>${d.day<4?'<button data-act="edFinish">Завершити 🏁</button>':""}<button class="ghost" data-act="edPrev">← Назад</button><button class="ghost" data-act="home">Закрити ✖️</button></div>`;
 }else if(st.step==="edOut"){
  const d=st.ed;
  h=`<div class="hero">🧾</div><h2>Розклад готовий: ${NAMES[d.key]}</h2>
  <p class="sub">Тут на сторінці він уже змінений, але до перезавантаження. Щоб зберегти назавжди, встав цей рядок у код:</p>
  <pre id="out">${e(schedLine(d.key,d.lists))}</pre>
  <div class="row"><button class="go" id="copy">📋 Скопіювати рядок</button></div>

  <li>Натисни Ctrl+F і знайди <code>${d.key}:[[</code>. Це один рядок у блоці <code>const SCHED</code> на початку скрипта.</li>

 $.innerHTML=h+(dbg?dbgHtml():"");
 const t=document.getElementById("txt");if(t)t.focus();
}
function build(){
 const body=st.list.map((l,i)=>{
  const a=st.ans[i];
  const head=`${l[0]} ${l[2]}`;
  return [head,a.r>0?`${a.r}/10 ${RATE[a.r-1]}`:"-/10",a.text.trim()].join("\n");
 }).join("\n\n");
 return dateLine()?dateLine()+"\n\n"+body:body;
}
function save(){const t=document.getElementById("txt");if(t)st.ans[st.i].text=t.value}
$.addEventListener("input",ev=>{
 if(ev.target.id==="txt"){
  st.ans[st.i].text=ev.target.value;
  const ok=okAns(st.ans[st.i]),act=document.getElementById("act"),hn=document.getElementById("hint");
  if(act&&!act.querySelector('[data-act="'+(ok?"next":"skip")+'"]'))act.innerHTML=actBtn(st.ans[st.i],st.i===st.list.length-1);
  if(hn)hn.hidden=ok;
 }else if(ev.target.id==="srch"){
  const q=ev.target.value.trim().toLowerCase();
  $.querySelectorAll(".pk").forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?"":"none");
 }
});
$.addEventListener("click",async ev=>{
 const b=ev.target.closest("button");if(!b)return;const d=b.dataset,ed=st.ed;
 if(d.who){st.who=d.who;if(d.who==="max")st.step="week";else begin()}
 else if(d.week){st.week=d.week;begin()}
 else if(d.dbg!==undefined){st.dbg=d.dbg==="auto"?null:+d.dbg}
 else if(d.r){save();const a=st.ans[st.i];a.r=a.r===+d.r?0:+d.r}
 else if(d.act==="dbg"){st.dbgOpen=!st.dbgOpen}
 else if(d.act==="home"){st.step="who"}
 else if(d.act==="next"){save();if(!okAns(st.ans[st.i]))return;if(st.i<st.list.length-1)st.i++;else st.step="out"}
 else if(d.act==="skip"){st.ans[st.i]={text:"-",r:-1};if(st.i<st.list.length-1)st.i++;else st.step="out"}
 else if(d.act==="prev"){save();if(st.step==="out")st.step="q";else if(st.i>0)st.i--;else st.step=st.who==="max"?"week":"who"}
 else if(d.act==="edit"){st.step="edWho"}
 else if(d.ed){st.ed={key:d.ed,day:0,pick:false,lists:SCHED[d.ed].map(l=>l.slice())};st.step="edDay"}
 else if(d.act==="pick"){ed.pick=true}
 else if(d.act==="unpick"){ed.pick=false}
 else if(d.add){ed.lists[ed.day].push(d.add);ed.pick=false}
 else if(d.rm!==undefined){ed.lists[ed.day].splice(+d.rm,1)}
 else if(d.mv){const[i,s]=d.mv.split(":").map(Number),L=ed.lists[ed.day],j=i+s;if(j>=0&&j<L.length)[L[i],L[j]]=[L[j],L[i]]}
 else if(d.act==="clear"){ed.lists[ed.day]=[]}
 else if(d.act==="edNext"){ed.pick=false;ed.day++}
 else if(d.act==="edFinish"){ed.pick=false;SCHED[ed.key]=ed.lists.map(l=>l.slice());st.step="edOut"}
 else if(d.act==="edPrev"){ed.pick=false;if(ed.day>0)ed.day--;else st.step="edWho"}
 else if(b.id==="copy"){
  const el=document.getElementById("out"),txt=el.textContent;
  try{await navigator.clipboard.writeText(txt)}catch(x){const r=document.createRange();r.selectNodeContents(el);getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand("copy")}
  b.textContent="Скопійовано ✓";return;
 }else return;
 render();
});
render();
